version: "3.9"

services:
  xfloor-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - xfloor-mcp
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/xfloor-mcp.conf:/etc/nginx/conf.d/default.conf:ro
