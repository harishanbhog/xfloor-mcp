[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xfloor-mcp"
version = "0.1.0"
description = "MCP server exposing xFloor APIs via Streamable HTTP and stdio"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "xfloor-mcp maintainers" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
xfloor-mcp = "xfloor_mcp.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["xfloor_mcp*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
